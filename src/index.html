<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Bipsy Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/webp" href="brand/favicon-48.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
  <script>
    // El tema se fija antes del primer pintado: si lo hiciera Angular, la
    // pantalla saldría un instante con el tema equivocado. Misma clave que
    // ThemeService.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('bipsy_admin_theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

      // Diseño y accesibilidad, por lo mismo: el tamaño de letra o el diseño
      // en bloques no pueden aparecer un instante después de pintar.
      try {
        var p = JSON.parse(localStorage.getItem('bipsy_admin_prefs') || '{}');
        var d = document.documentElement.dataset;
        d.layout = p.layout || 'sidebar';
        d.text = p.textSize || 'normal';
        d.motion = p.motion || 'system';
        if (p.highContrast) d.contrast = 'high';
        if (p.underlineLinks) d.links = 'underline';
        if (p.largeTargets) d.targets = 'large';
        if (p.strongFocus) d.focus = 'strong';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
